openapi: 3.1.0
info:
  title: Mirsad integration API
  version: 0.1.0
  description: Register conversations, submit intake events, control AI review and read timelines. Every JSON response uses the envelope `{ success, data, error }`; the artifact route (PNG) and the event stream (SSE) are the two exceptions. Everything here is served on a loopback address only.
servers:
  - url: http://127.0.0.1:8787
    description: Default local address; the port is configurable.
tags:
  - name: contract
    description: Routes of the integration contract.
  - name: extension
    description: Routes beyond the integration contract table; each exists because a requirement cannot be met without it.
  - name: dashboard
    description: Static files of the reference dashboard.
security: []
paths:
  /v1/auth/login:
    post:
      operationId: post_v1AuthLogin
      summary: Sign in to the officer dashboard
      tags:
        - extension
      security: &a6 []
      description: "A temporary password returns passwordChangeRequired. Submit the username and temporary password again with a different newPassword (12–128 characters) to receive a session. Pass the returned session token in the Authorization bearer header. Responses use Cache-Control: no-store. Browser requests must use the same origin and send JSON."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficerLoginRequest"
      responses:
        "200":
          description: Officer session issued or first-login password change required.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/OfficerLoginResponse"
                  error:
                    type: "null"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `origin_not_allowed`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: "Error envelope. `error.code` is one of: `payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/logout:
    post:
      operationId: post_v1AuthLogout
      summary: Revoke the current officer session
      tags:
        - extension
      security: &a1
        - officerToken: []
      description: Requires the password session to revoke. Browser requests must use the same origin.
      responses:
        "200":
          description: Officer session revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/OfficerLogoutResponse"
                  error:
                    type: "null"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `origin_not_allowed`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: "Error envelope. `error.code` is one of: `payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/chats:
    post:
      operationId: post_v1Chats
      summary: Register an existing conversation
      tags:
        - contract
      security: *a1
      description: Returns a stable `chatId` for the workspace, source, account and conversation. `201` when new, `200` when it already existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterChatRequest"
      responses:
        "200":
          description: The chat already existed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/RegisterChatResponse"
                  error:
                    type: "null"
        "201":
          description: Chat registered.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/RegisterChatResponse"
                  error:
                    type: "null"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `account_not_authorized`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `account_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Error envelope. `error.code` is one of: `channel_not_enabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: get_v1Chats
      summary: List authorized conversations
      tags:
        - contract
      security: *a1
      parameters:
        - name: inboxStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - new_inbound
              - open
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: A page of chats.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/ListChatsResponse"
                  error:
                    type: "null"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/ingest:
    post:
      operationId: post_v1Ingest
      summary: Submit an intake event
      tags:
        - contract
      security: &a2
        - connectorToken: []
      description: Creates or finds the chat and appends the event in one transaction. An inbound message for a new chat enters `New inbound`. `201` when something new was stored, `200` for a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Duplicate event or message; nothing new stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/IngestResult"
                  error:
                    type: "null"
        "201":
          description: Event recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/IngestResult"
                  error:
                    type: "null"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `account_not_authorized`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `message_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "Error envelope. `error.code` is one of: `history_erased`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: "Error envelope. `error.code` is one of: `payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Error envelope. `error.code` is one of: `channel_not_enabled`, `direction_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/chats/{chatId}/events:
    post:
      operationId: post_v1ChatsChatIdEvents
      summary: Submit an intake event to a registered chat
      tags:
        - contract
      security: *a2
      description: Same ingestion logic as `POST /v1/ingest`, addressed by `chatId`.
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeEvent"
      responses:
        "200":
          description: Duplicate event or message; nothing new stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/IngestResult"
                  error:
                    type: "null"
        "201":
          description: Event recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/IngestResult"
                  error:
                    type: "null"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `chat_not_found`, `message_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "Error envelope. `error.code` is one of: `history_erased`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: "Error envelope. `error.code` is one of: `payload_too_large`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Error envelope. `error.code` is one of: `channel_not_enabled`, `direction_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/dispatches:
    post:
      operationId: post_v1Dispatches
      summary: Start AI on selected chats
      tags:
        - contract
      security: *a1
      description: Start eligible chats. A single-chat Dispatch can record prior participant permission with participantPermissionRecorded=true. expectedTestMode=true also requires new-contact invitations to remain disabled. This action can authorize the latest unanswered Telegram DM within 24 hours for up to 15 minutes. An optional officer briefing applies to one chat. Send null to clear the briefing. Paused and officer-controlled chats require Resume. Requires `Idempotency-Key`.
      parameters:
        - &a3
          name: Idempotency-Key
          in: header
          required: true
          description: Scoped to principal and route (and chat). The same key with the same body replays the stored response; the same key with a different body answers `422 idempotency_key_reused`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: ^[\x21-\x7e]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "200":
          description: Per-chat dispatch results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/DispatchResponse"
                  error:
                    type: "null"
          headers: &a4
            Idempotency-Replayed:
              description: Set to `true` when the stored response of an earlier request with the same key is replayed.
              schema:
                type: string
                enum:
                  - "true"
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`, `idempotency_key_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `chat_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Error envelope. `error.code` is one of: `revision_conflict`, `invalid_transition`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "Error envelope. `error.code` is one of: `history_erased`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Error envelope. `error.code` is one of: `idempotency_key_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/dispatches/by-phone:
    post:
      operationId: post_v1DispatchesBy-phone
      summary: Dispatch an existing Telegram private chat by verified phone number
      tags:
        - extension
      security: *a1
      description: Matches the latest self-shared contact card on an authorized live account. A unique match uses normal Dispatch controls. An officer may record existing participant permission for that chat by setting participantPermissionRecorded to true. Missing or ambiguous matches return only an outcome. Enter a complete international number with + or 00 and the exact international dialling digits.
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchByPhoneRequest"
      responses:
        "200":
          description: Dispatch result or an unresolved match.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                  - error
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/DispatchByPhoneResponse"
                  error:
                    type: "null"
          headers: *a4
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`, `idempotency_key_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `chat_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Error envelope. `error.code` is one of: `invalid_transition`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: "Error envelope. `error.code` is one of: `history_erased`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Error envelope. `error.code` is one of: `idempotency_key_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Error envelope. `error.code` is one of: `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Error envelope. `error.code` is one of: `internal_error`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
