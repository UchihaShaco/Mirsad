              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `not_controller`, `host_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Error envelope. `error.code` is one of: `chat_not_found`."
          content:
            application/json:
              schema:
