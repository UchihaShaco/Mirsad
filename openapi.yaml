            initiationBasis: null
            firstObservedDirection: incoming
            intakeAccount: false
            acknowledgementTemplate: null
            review: &a9
              state: active
              pending: 1
              unavailable: 0
            watchlistMatches: &a10 []
            messageCount: 1
            lastActivityAt: 2026-11-21T08:00:02.000Z
            createdAt: 2026-11-21T08:00:00.000Z
          messages:
            - id: msg_0123456789abcdef0123456789abcdef
              chatId: chat_0123456789abcdef0123456789abcdef
              direction: incoming
              origin: source
              text: Hello, is this the right number for my order?
              originalCaptured: true
              unsupportedContent: []
              sentAt: null
              receivedAt: 2026-11-21T08:00:02.000Z
              source:
                channel: telegram
