              review:
                status: pending
                outcome: null
                updatedAt: 2026-11-21T08:00:02.000Z
              editedAtSource: false
              deletedAtSource: false
              position: 5
          messageEvents: []
          caseActions:
            - id: act_00000000000000000000000000000001
              chatId: chat_0123456789abcdef0123456789abcdef
