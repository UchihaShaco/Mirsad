  /v1/events:
    get:
      operationId: get_v1Events
      summary: Subscribe to workspace events
      tags:
        - contract
      security: *a1
      description: Server-sent events. The start position is the `Last-Event-ID` header, else `cursor`, else the current head. A position outside retained history yields a `stream.reset` event telling the client to reload the inbox and timeline. Event data carries ids and statuses only.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Decimal stream position, usually `cursor` from a timeline or chat list. Ignored when `Last-Event-ID` is sent.
          schema:
            type: string
            pattern: ^\d{1,15}$
        - name: Last-Event-ID
          in: header
          required: false
          description: The `id` of the last event the client saw; the stream resumes after it.
          schema:
            type: string
            pattern: ^\d{1,15}$
      responses:
        "200":
          description: An open `text/event-stream`.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: "Error envelope. `error.code` is one of: `validation_failed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Error envelope. `error.code` is one of: `unauthenticated`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Error envelope. `error.code` is one of: `forbidden_for_principal`, `host_not_allowed`."
          content:
            application/json:
              schema:
