components:
  securitySchemes:
    officerToken:
      type: http
      scheme: bearer
      description: An officer token, sent only in the Authorization header. Never put a token in a URL.
    connectorToken:
      type: http
      scheme: bearer
      description: A connector token (intake), sent only in the Authorization header. Never put a token in a URL.
  schemas:
    EraseRequest:
      type: object
      properties:
        expectedSnapshot:
          type: string
          pattern: ^[a-f0-9]{64}$
        confirm:
          type: boolean
          const: true
      required:
        - expectedSnapshot
        - confirm
      additionalProperties: false
    ConsentPromptRequest:
      oneOf:
        - type: object
          properties:
            enabled:
              type: boolean
              const: false
          required:
            - enabled
          additionalProperties: false
        - type: object
          properties:
            enabled:
              type: boolean
              const: true
            manualDispatchOnly:
              type: boolean
              const: true
          required:
            - enabled
          additionalProperties: false
    IngestRequest:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/Source"
        externalAccountId:
          type: string
          minLength: 1
          maxLength: 200
        externalChatId:
          type: string
          minLength: 1
          maxLength: 200
        chat:
          type: object
          properties:
            displayLabel:
              type: string
              minLength: 1
              maxLength: 200
        event:
          $ref: "#/components/schemas/IntakeEvent"
      required:
        - source
        - externalAccountId
        - externalChatId
        - event
    IntakeEvent:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: message.recorded
            sourceEventId:
              type: string
              minLength: 1
              maxLength: 200
            sourceMessageId:
              type: string
              minLength: 1
              maxLength: 200
            direction:
              $ref: "#/components/schemas/Direction"
            text:
              type: string
              maxLength: 65536
            sentAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            sender:
              type: object
              properties:
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 200
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                phone:
                  type: object
                  properties:
                    raw:
                      type: string
                      minLength: 1
                      maxLength: 64
                    country:
                      type: string
                      pattern: ^[A-Z]{2}$
                    internationalFormat:
                      type: boolean
                  required:
                    - raw
            conversationStart:
              type: object
              properties:
                basis:
                  type: string
                  enum:
                    - source_start_marker
                    - confirmed_complete_history
              required:
                - basis
            unsupportedContent:
              maxItems: 20
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 40
          required:
            - type
            - sourceEventId
            - sourceMessageId
            - direction
            - text
        - type: object
          properties:
            type:
              type: string
              const: message.edited
            sourceEventId:
              type: string
              minLength: 1
              maxLength: 200
            sourceMessageId:
              type: string
              minLength: 1
              maxLength: 200
            text:
              type: string
              maxLength: 65536
            editedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            direction:
              $ref: "#/components/schemas/Direction"
            reviewAttachments:
              maxItems: 5
              type: array
              items:
                type: string
                enum:
                  - document
                  - location
                  - venue
                  - forwarded
                  - blockquote
          required:
            - type
            - sourceEventId
            - sourceMessageId
            - text
        - type: object
          properties:
            type:
              type: string
              const: message.deleted
            sourceEventId:
              type: string
              minLength: 1
              maxLength: 200
            sourceMessageId:
              type: string
              minLength: 1
              maxLength: 200
            deletedAt:
              type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            direction:
              $ref: "#/components/schemas/Direction"
          required:
            - type
            - sourceEventId
            - sourceMessageId
    RegisterChatRequest:
      type: object
