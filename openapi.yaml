x-workflow-example:
  - step: 1
    name: register_chat
    summary: The host registers one of its conversations on the officer account.
    method: POST
    path: /v1/chats
    headers:
      Authorization: Bearer <officer token>
      Content-Type: application/json
    requestBody:
      source: telegram
      externalAccountId: tg-demo-officer
      externalChatId: host-conversation-1001
      displayLabel: Test Contact
    response:
      status: 201
      body:
        success: true
        data:
          chat:
            id: chat_0123456789abcdef0123456789abcdef
            source: telegram
            channelLabel: Telegram
            externalAccountId: tg-demo-officer
            externalChatId: host-conversation-1001
            displayLabel: Test Contact
            inboxStatus: open
            telegramReplyHold:
              contactOptedOut: false
              officerReview: null
              evidenceItems: []
            lowerConcern: null
            previousLowerConcern: null
            aiMode: not_started
            revision: 1
            controller: null
            originLabel: No messages observed
            initiatedBy: unknown
            initiationBasis: null
            firstObservedDirection: null
            intakeAccount: false
            acknowledgementTemplate: null
            review:
              state: idle
              pending: 0
              unavailable: 0
            watchlistMatches: []
            messageCount: 0
            lastActivityAt: 2026-11-21T08:00:00.000Z
            createdAt: 2026-11-21T08:00:00.000Z
          created: true
        error: null
  - step: 2
    name: dispatch
    summary: The officer starts AI review on the chat. The Idempotency-Key makes a retry safe.
    method: POST
    path: /v1/dispatches
    headers:
      Authorization: Bearer <officer token>
      Content-Type: application/json
      Idempotency-Key: <unique key>
    requestBody:
      chatIds:
        - chat_0123456789abcdef0123456789abcdef
    response:
      status: 200
      body:
        success: true
        data:
          dispatchId: dsp_0123456789abcdef0123456789abcdef
          results:
            - chatId: chat_0123456789abcdef0123456789abcdef
              status: started
              aiMode: ai_active
              revision: 2
        error: null
  - step: 3
    name: submit_inbound_event
    summary: The connector reports one incoming message for the registered chat.
    method: POST
    path: /v1/chats/{chatId}/events
    headers:
      Authorization: Bearer <connector token>
      Content-Type: application/json
    requestBody:
      type: message.recorded
      sourceEventId: host-event-1
      sourceMessageId: host-message-1
      direction: incoming
      text: Hello, is this the right number for my order?
    response:
      status: 201
      body:
        success: true
        data:
          chatId: chat_0123456789abcdef0123456789abcdef
          chatCreated: false
          result: recorded
          messageId: msg_0123456789abcdef0123456789abcdef
          messageEventId: mev_0123456789abcdef0123456789abcdef
          receivedAt: 2026-11-21T08:00:02.000Z
          captureId: cap_0123456789abcdef0123456789abcdef
          startMarker: none
          textConflict: false
        error: null
  - step: 4
