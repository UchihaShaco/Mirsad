<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirsad Contact Sync</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --red:#dc2626; --green:#16a34a; --accent:#0E4D45; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --fg:#e8eaee; --muted:#9aa1ad; --line:#2a2f3a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { flex:1 1 180px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; }
  button { padding:9px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  .phone { font-family:ui-monospace,Consolas,monospace; }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .live { color:var(--green); border-color:var(--green); }
  .switch { position:relative; width:44px; height:24px; display:inline-block; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.15s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--red); }
  .switch input:checked + .slider:before { transform:translateX(20px); }
  #err { color:var(--red); min-height:1.2em; margin-top:8px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mirsad <span class="muted">· known scammer contacts</span></h1>
  <div class="sub">Numbers switched <b>on</b> are pushed to every connected phone's "Known Scammer" contact.
    <span id="status" class="pill">offline</span> <span id="devices" class="pill">0 phones connected</span></div>

  <div class="card" id="authCard" hidden>
    <div class="row">
      <input id="token" type="password" placeholder="Admin token (SCAMSHIELD_ADMIN_TOKEN)">
      <button id="saveToken">Connect</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="phone" placeholder="+65 9123 4567">
      <input id="label" placeholder="Label (optional, e.g. @scammer_handle)">
      <button id="add">Flag as scammer</button>
    </div>
    <div id="err"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Number</th><th>Label</th><th>Source</th><th>On phones</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('ss_admin') || ''; } catch {}
$('token').value = token;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) $('authCard').hidden = false;   // only shown if the server has an admin token set
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load() {
  try {
    const d = await api('/api/v1/scammers');
    $('devices').textContent = d.devices_connected + (d.devices_connected === 1 ? ' phone' : ' phones') + ' connected';
    $('rows').innerHTML = d.scammers.length ? d.scammers.map(s => `
      <tr>
        <td class="phone">${esc(s.phone)}</td>
        <td>${esc(s.label)}</td>
        <td class="muted">${esc(s.source)}</td>
        <td><label class="switch"><input type="checkbox" data-toggle="${esc(s.phone)}" ${s.active ? 'checked' : ''}><span class="slider"></span></label></td>
        <td><button class="ghost" data-del="${esc(s.phone)}">Delete</button></td>
      </tr>`).join('') : '<tr><td colspan="5" class="muted">No numbers yet.</td></tr>';
    $('err').textContent = '';
  } catch (e) { $('err').textContent = e.message; }
}

let ws;
function connectWs() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/api/v1/ws?role=dashboard&token=${encodeURIComponent(token)}`);
  ws.onopen = () => { $('status').textContent = 'live'; $('status').classList.add('live'); };
  ws.onclose = () => { $('status').textContent = 'offline'; $('status').classList.remove('live'); setTimeout(connectWs, 3000); };
  ws.onmessage = () => load();   // any change anywhere -> refresh table
}

$('saveToken').onclick = () => {
  token = $('token').value.trim();
  try { localStorage.setItem('ss_admin', token); } catch {}
  load(); connectWs();
};
$('add').onclick = async () => {
  try {
    await api('/api/v1/scammers', { method: 'POST', body: JSON.stringify({ phone: $('phone').value, label: $('label').value || null, source: 'dashboard' }) });
    $('phone').value = ''; $('label').value = ''; load();
  } catch (e) { $('err').textContent = e.message; }
};
$('rows').addEventListener('change', async (e) => {
  const p = e.target.dataset.toggle; if (!p) return;
  try { await api(`/api/v1/scammers/${encodeURIComponent(p)}`, { method: 'PATCH', body: JSON.stringify({ active: e.target.checked }) }); }
  catch (err) { $('err').textContent = err.message; load(); }
});
$('rows').addEventListener('click', async (e) => {
  const p = e.target.dataset.del; if (!p) return;
  try { await api(`/api/v1/scammers/${encodeURIComponent(p)}`, { method: 'DELETE' }); load(); }
  catch (err) { $('err').textContent = err.message; }
});
load(); connectWs();
</script>
</body>
</html>
